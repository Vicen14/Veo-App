<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-card">
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <ion-item>
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input type="email" formControlName="email"></ion-input>
      </ion-item>
      <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-msg">
        Correo inválido
      </div>

      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" formControlName="password"></ion-input>
      </ion-item>
      <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-msg">
        La contraseña es requerida (min 6 caracteres)
      </div>

      <div class="actions">
        <ion-button expand="block" color="primary" type="submit" [disabled]="loginForm.invalid">Iniciar sesión</ion-button>
        <ion-button expand="block" fill="clear" routerLink="/registrarse">Registrarse</ion-button>
      </div>

      <div class="forgot">
        <ion-button fill="clear" size="small" routerLink="/olvidaste-tu-contraseña">¿Olvidaste tu contraseña?</ion-button>
      </div>
    </form>

    <div class="nav-row">
      <ion-button class="nav-btn" fill="solid" routerLink="/tabs/tab1">
        <ion-icon name="navigate-outline"></ion-icon>
        <span>Explorar</span>
      </ion-button>
      <ion-button class="nav-btn" fill="solid" routerLink="/tabs/perfil">
        <ion-icon name="person-outline"></ion-icon>
        <span>Perfil</span>
      </ion-button>
      <ion-button class="nav-btn" fill="solid" routerLink="/registrarse">
        <ion-icon name="person-add-outline"></ion-icon>
        <span>Registrarse</span>
      </ion-button>
    </div>
  </div>

  <ion-toast
    [isOpen]="isToastOpen"
    [message]="toastMessage"
    [duration]="2000"
    (didDismiss)="setOpen(false)"
  ></ion-toast>
</ion-content>
