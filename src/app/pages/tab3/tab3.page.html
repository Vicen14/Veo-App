<ion-header class="ion-no-border">
  <ion-toolbar class="top-toolbar">
    <div class="toolbar-row">
      <div class="title">Favoritos</div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="content-wrapper">
    <div class="empty-state" *ngIf="favorites.length === 0">
      <ion-icon name="heart-dislike-outline"></ion-icon>
      <p>No tienes lugares favoritos guardados.</p>
      <p class="sub-text">Explora y marca tus lugares preferidos.</p>
    </div>

    <div class="list-container" *ngIf="favorites.length > 0">
      <div class="place-card" *ngFor="let fav of favorites">
        <div class="thumb">
           <img [src]="fav.photoUrl || fallbackImg" alt="{{ fav.name }}" />
        </div>
        <div class="info">
           <div class="title-row">
             <h3 class="name">{{ fav.name }}</h3>
             <div class="rating" *ngIf="fav.rating">
               <ion-icon name="star"></ion-icon>
               <span class="rating-value">{{ fav.rating | number:'1.1-1' }}</span>
             </div>
           </div>
           <p class="desc">{{ fav.address }}</p>
        </div>
        <div class="actions">
           <ion-button fill="clear" color="danger" (click)="removeFavorite(fav)">
             <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
           </ion-button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
