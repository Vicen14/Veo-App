<ion-header class="ion-no-border">
  <ion-toolbar class="top-toolbar">
    <div class="toolbar-row">
      <div class="title">Mis lugares</div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="content-wrapper">
    <!-- Loading State -->
    <div class="status-card" *ngIf="loading">
      <ion-spinner name="crescent"></ion-spinner>
      <ion-text>Cargando base de datos…</ion-text>
    </div>

    <!-- Error State -->
    <div class="status-card error" *ngIf="!loading && errorMessage">
      <ion-text color="danger">{{ errorMessage }}</ion-text>
    </div>

    <!-- Form Card -->
    <div class="form-card">
      <h2>Agregar Lugar</h2>
      <form (ngSubmit)="onSubmit()" novalidate>
        <div class="input-group">
          <label>Nombre del lugar</label>
          <input type="text" name="venueName" [(ngModel)]="form.name" required [disabled]="saving" placeholder="Ej. Casa de Juan">
        </div>

        <div class="input-group">
          <label>Descripción (opcional)</label>
          <textarea name="venueDescription" [(ngModel)]="form.description" [disabled]="saving" placeholder="Detalles del lugar..."></textarea>
        </div>

        <div class="input-group">
          <label>Dirección (opcional)</label>
          <input #addressInput type="text" name="venueAddress" [(ngModel)]="form.address" [disabled]="saving" placeholder="Ej. Av. Libertador 123" (blur)="onAddressChange()">
        </div>

        <!-- Map Container -->
        <div class="map-container" [style.display]="form.address ? 'block' : 'none'">
          <div #mapEl class="map"></div>
        </div>

        <ion-button expand="block" class="action-btn" type="submit" [disabled]="saving">
          {{ saving ? 'Guardando…' : 'Guardar lugar' }}
        </ion-button>
      </form>
    </div>

    <!-- Clear Button -->
    <ion-button expand="block" fill="clear" color="medium" class="clear-btn" [disabled]="saving || !venues.length" (click)="onClear()">
      Limpiar registros
    </ion-button>

    <!-- Venues List -->
    <div class="section-title" *ngIf="venues.length">Lugares Guardados</div>
    
    <div class="list-container" *ngIf="!loading && venues.length">
      <div class="place-card" *ngFor="let venue of venues">
        <div class="info">
          <div class="title-row">
            <h3 class="name">{{ venue.name }}</h3>
          </div>
          <p class="desc" *ngIf="venue.description">{{ venue.description }}</p>
          <p class="desc address" *ngIf="venue.address">
            <ion-icon name="location-outline"></ion-icon>
            {{ venue.address }}
          </p>
          <div class="meta-row">
            <div class="meta">
              <ion-icon name="time-outline"></ion-icon>
              <span>{{ venue.createdAt | date: 'short' }}</span>
            </div>
          </div>
        </div>
        <div class="actions">
          <ion-button fill="clear" color="danger" (click)="onDelete(venue.id)">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-button>
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="!loading && !venues.length">
      <ion-icon name="folder-open-outline"></ion-icon>
      <p>Aún no hay registros guardados.</p>
    </div>


  </div>
</ion-content>
